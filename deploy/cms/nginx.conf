server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        # main.dart.js tidak punya hash di namanya: browser harus mengecek versi baru tiap CMS dibuka.
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
