worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rootfs container read-only: semua berkas sementara ke /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Berkas Flutter web tidak punya hash di namanya: selalu validasi ke server (ETag).
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
