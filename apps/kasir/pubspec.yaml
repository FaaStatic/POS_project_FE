name: kasir
description: Offline-first cashier app (Android, iOS).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
  ui:
  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_bloc: ^9.1.1
  flutter_bluetooth_printer: ^2.24.0
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  iconsax_flutter: ^1.0.1
  intl: ^0.20.3
  mmkv: ^2.4.3
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0
  workmanager: ^0.10.10
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  dio: ^5.11.1
  drift: ^2.35.3
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.dev
    - .env.prod
