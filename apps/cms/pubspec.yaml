name: cms
description: myPOS, the store admin panel for sales, stock, and debts (web).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
  ui:
  bloc: ^9.2.1
  fl_chart: ^1.3.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  iconsax_flutter: ^1.0.1
  intl: ^0.20.3
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  dio: ^5.11.1
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.dev
    - .env.prod
