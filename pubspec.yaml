name: shop_fe_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/core
  - packages/ui
  - apps/cms
  - apps/kasir

dev_dependencies:
  melos: 8.10.0

melos:
  command:
    run:
      noSelect: true
  scripts:
    setup:
      description: Generate localizations and code (freezed, json, drift). Run after pub get.
      steps:
        - gen_l10n
        - build_runner
    cms:
      description: Run the CMS in Chrome on port 5173 (dev). Extra flutter args go after "--".
      run: cd apps/cms && flutter run -d chrome --web-port 5173 --pid-file "$MELOS_ROOT_PATH/.dart_tool/cms.pid" -t lib/main_dev.dart
      stdio: inherit
    kasir:
      description: Run the kasir app (prod flavor, prod API). Pick a device with "-- -d <device-id>".
      run: cd apps/kasir && flutter run --flavor prod --pid-file "$MELOS_ROOT_PATH/.dart_tool/kasir.pid" -t lib/main_prod.dart
      stdio: inherit
    kasir-dev:
      description: Run the kasir app (dev flavor, local API). Pick a device with "-- -d <device-id>".
      run: cd apps/kasir && flutter run --flavor dev --pid-file "$MELOS_ROOT_PATH/.dart_tool/kasir.pid" -t lib/main_dev.dart
      stdio: inherit
    kasir-staging:
      description: Run the kasir app (staging flavor). Pick a device with "-- -d <device-id>".
      run: cd apps/kasir && flutter run --flavor staging --pid-file "$MELOS_ROOT_PATH/.dart_tool/kasir.pid" -t lib/main_staging.dart
      stdio: inherit
    cms-reload:
      description: Hot reload the running CMS (from a second terminal).
      run: kill -USR1 "$(cat "$MELOS_ROOT_PATH/.dart_tool/cms.pid" 2>/dev/null)" 2>/dev/null || echo "CMS is not running. Start it with melos run cms"
    cms-restart:
      description: Hot restart the running CMS.
      run: kill -USR2 "$(cat "$MELOS_ROOT_PATH/.dart_tool/cms.pid" 2>/dev/null)" 2>/dev/null || echo "CMS is not running. Start it with melos run cms"
    kasir-reload:
      description: Hot reload the running kasir app (from a second terminal).
      run: kill -USR1 "$(cat "$MELOS_ROOT_PATH/.dart_tool/kasir.pid" 2>/dev/null)" 2>/dev/null || echo "Kasir is not running. Start it with melos run kasir"
    kasir-restart:
      description: Hot restart the running kasir app.
      run: kill -USR2 "$(cat "$MELOS_ROOT_PATH/.dart_tool/kasir.pid" 2>/dev/null)" 2>/dev/null || echo "Kasir is not running. Start it with melos run kasir"
    build-cms:
      description: Release web build of the CMS (prod env) into apps/cms/build/web.
      run: cd apps/cms && flutter build web -t lib/main_prod.dart
    build-apk:
      description: Release APK of the kasir app (prod env).
      run: cd apps/kasir && flutter build apk --flavor prod -t lib/main_prod.dart
    build-apk-staging:
      description: Release APK of the kasir app (staging flavor).
      run: cd apps/kasir && flutter build apk --flavor staging -t lib/main_staging.dart
    build-ipa:
      description: Release IPA of the kasir app (prod env, needs Apple signing).
      run: cd apps/kasir && flutter build ipa --flavor prod -t lib/main_prod.dart
    build-ipa-staging:
      description: Release IPA of the kasir app (staging flavor, needs Apple signing).
      run: cd apps/kasir && flutter build ipa --flavor staging -t lib/main_staging.dart
    integration:
      description: Kasir integration tests on a device. Pick it with "-- -d <device-id>".
      run: cd apps/kasir && flutter test integration_test --flavor dev
    analyze:
      exec:
        command: flutter analyze --no-fatal-infos
        concurrency: 1
      description: Static analysis for every package.
    test:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Unit and widget tests for every package.
    coverage:
      exec:
        command: flutter test --coverage && dart run $MELOS_ROOT_PATH/tool/check_coverage.dart
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Fails when domain, data, or presentation/bloc coverage drops under 80%.
    build_runner:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Code generation (freezed, json_serializable, drift).
    gen_l10n:
      exec:
        command: flutter gen-l10n
        concurrency: 1
      packageFilters:
        fileExists: l10n.yaml
      description: Generate localizations from ARB files.
