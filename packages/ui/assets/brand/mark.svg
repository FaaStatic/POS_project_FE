<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
<title id="title">myPOS / myKasir brand mark</title>
<desc id="desc">Bold M monogram beneath a shop awning inside a deep mint rounded square.</desc>
<rect width="100" height="100" rx="25" fill="#065F46"/>
<g fill="#FFFFFF">
  <!-- Broad shop awning -->
  <path d="M22 40 L32 22 H68 L78 40 Z"/>
  <!-- Negative-space divisions make the awning legible without a third color -->
  <path d="M38 22 H46 L54 40 H46 Z M55 22 H63 L71 40 H63 Z" fill="#065F46"/>
  <!-- Heavy geometric M monogram -->
  <path d="M25 77 V45 H36 L50 60 L64 45 H75 V77 H62 V62 L50 74 L38 62 V77 Z"/>
</g>
</svg>
