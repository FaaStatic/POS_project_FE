name: ui
description: Design tokens, light/dark theme, and shared components.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  iconsax_flutter: ^1.0.1
  intl: ^0.20.3
  cached_network_image: ^4.0.5
  flutter_svg: ^2.3.0
  shadcn_ui: ^0.57.3

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Typed access to assets/brand and the Inter family: Assets.brand.mark, FontFamily.inter.
flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      package_parameter_enabled: true
  integrations:
    flutter_svg: true

flutter:
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
