name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # .env.dev and .env.prod are not tracked but are declared as assets, so the build needs them.
      - name: Create env files from the templates
        run: |
          for app in cms kasir; do
            cp apps/$app/.env.example apps/$app/.env.dev
            cp apps/$app/.env.example apps/$app/.env.prod
            sed -i 's/^FLAVOR=.*/FLAVOR=prod/' apps/$app/.env.prod
          done
      - run: flutter pub get
      - run: dart run melos run gen_l10n
      - run: dart run melos run analyze
      - run: dart run melos run test
      - run: dart run melos run coverage
