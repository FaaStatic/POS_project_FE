name: deploy

# master: otomatis setelah workflow "ci" hijau -> production (cms, APK kasir flavor prod).
# dev: hanya manual (Actions > deploy > Run workflow > pilih branch dev) -> staging (cms-staging, APK kasir flavor staging).
# CMS: build + test Flutter web -> image nginx -> cek versi -> deploy -> healthcheck di server -> tes publik -> rollback bila gagal.
# Kasir: build APK release (artifact); tidak menyentuh VPS.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    # workflow_run juga terpicu oleh CI yang gagal atau PR; hanya push yang lulus yang lanjut.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service: ${{ steps.target.outputs.service }}
      environment: ${{ steps.target.outputs.environment }}
      flavor: ${{ steps.target.outputs.flavor }}
      host: ${{ steps.target.outputs.host }}
      api_url: ${{ steps.target.outputs.api_url }}
      image: ${{ steps.target.outputs.image }}
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          case "$BRANCH" in
            master)
              service=cms; environment=production; flavor=prod
              host=cms.toko-novi.my.id; api_url=https://api.toko-novi.my.id
              image=ghcr.io/faastatic/pos-cms ;;
            dev)
              service=cms-staging; environment=staging; flavor=staging
              host=cms-staging.toko-novi.my.id; api_url=https://api-staging.toko-novi.my.id
              image=ghcr.io/faastatic/pos-cms-staging ;;
            *) echo "branch $BRANCH tidak boleh di-deploy" >&2; exit 1 ;;
          esac
          {
            echo "service=$service"
            echo "environment=$environment"
            echo "flavor=$flavor"
            echo "host=$host"
            echo "api_url=$api_url"
            echo "image=$image"
            echo "sha=$SHA"
            echo "tag=sha-${SHA::12}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      # Versi Flutter sama dengan yang dipakai ci.yml.
      - id: flutter
        run: |
          echo "version=$(sed -n 's/^ *flutter-version: *//p' .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # .env.* tidak ada di git tapi dideklarasikan sebagai asset. Alamat API ditulis ke bundel saat build,
      # jadi .env.prod CMS diarahkan ke API milik environment target.
      - name: Siapkan file env
        env:
          API_URL: ${{ needs.target.outputs.api_url }}
          FLAVOR: ${{ needs.target.outputs.flavor }}
        run: |
          for app in cms kasir; do
            for name in dev staging prod; do
              cp apps/$app/.env.example apps/$app/.env.$name
              sed -i "s/^FLAVOR=.*/FLAVOR=$name/" apps/$app/.env.$name
            done
          done
          sed -i "s|^API_BASE_URL=.*|API_BASE_URL=$API_URL|; s/^FLAVOR=.*/FLAVOR=$FLAVOR/" apps/cms/.env.prod

      - run: flutter pub get
      - run: dart run melos run gen_l10n
      - run: dart run melos run analyze
      - run: dart run melos run test

      - name: Build web CMS
        run: cd apps/cms && flutter build web --release -t lib/main_prod.dart

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/cms/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.target.outputs.image }}:${{ needs.target.outputs.tag }}

  deploy:
    needs: [target, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secret VPS_SSH_KEY diisi per environment: production = gha-fe-prod, staging = gha-fe-staging.
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      packages: read
    env:
      SERVICE: ${{ needs.target.outputs.service }}
      TAG: ${{ needs.target.outputs.tag }}
      CMS_HOST: ${{ needs.target.outputs.host }}
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config

      - name: Cek versi terpasang
        run: |
          echo "Versi baru: $TAG"
          ssh vps "status $SERVICE"

      # Di server (deploy.sh): pull image -> up -d -> healthcheck container; gagal -> kembali ke versi sebelumnya.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps "deploy $SERVICE $TAG $OWNER"

      - name: Tes lewat domain publik
        id: smoke
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o page.html -w '%{http_code}' --max-time 10 "https://$CMS_HOST/" || true)
            if [ "$code" = 200 ] && grep -qi flutter page.html; then echo "OK (HTTP $code)"; exit 0; fi
            echo "percobaan $i: HTTP $code"; sleep 3
          done
          exit 1

      - name: Rollback ke versi sebelumnya
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh vps "rollback $SERVICE"

  apk:
    # Setelah build lulus (analyze + test), jadi APK tidak dibuat dari kode yang gagal test.
    needs: [target, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secret ANDROID_* diisi per environment.
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
    env:
      FLAVOR: ${{ needs.target.outputs.flavor }}
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - id: flutter
        run: |
          echo "version=$(sed -n 's/^ *flutter-version: *//p' .github/workflows/ci.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Siapkan file env
        env:
          API_URL: ${{ needs.target.outputs.api_url }}
        run: |
          for app in cms kasir; do
            for name in dev staging prod; do
              cp apps/$app/.env.example apps/$app/.env.$name
              sed -i "s/^FLAVOR=.*/FLAVOR=$name/" apps/$app/.env.$name
            done
          done
          sed -i "s|^API_BASE_URL=.*|API_BASE_URL=$API_URL|" apps/kasir/.env.$FLAVOR

      # Tanpa keystore build.gradle.kts memakai debug key: boleh untuk staging, tidak untuk production.
      - name: Siapkan keystore
        working-directory: apps/kasir/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$ENVIRONMENT" = production ]; then echo "Secret keystore belum diset di environment production" >&2; exit 1; fi
            echo "::warning::Keystore belum diset: APK ditandatangani debug key, hanya untuk perangkat uji"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - run: flutter pub get
      - run: dart run melos run gen_l10n

      - name: Build APK
        working-directory: apps/kasir
        # versionCode dari nomor run: selalu naik, Android menolak update dengan versionCode lebih rendah.
        run: >-
          flutter build apk --release --flavor "$FLAVOR" -t "lib/main_$FLAVOR.dart"
          --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      - name: Hapus keystore dari runner
        if: always()
        working-directory: apps/kasir/android
        run: rm -f app/upload-keystore.jks key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: kasir-${{ needs.target.outputs.flavor }}-apk-${{ github.run_number }}
          path: apps/kasir/build/app/outputs/flutter-apk/app-${{ needs.target.outputs.flavor }}-release.apk
          retention-days: 30
      # Symbol untuk membaca stack trace dari build yang di-obfuscate.
      - uses: actions/upload-artifact@v4
        with:
          name: kasir-${{ needs.target.outputs.flavor }}-symbols-${{ github.run_number }}
          path: apps/kasir/build/symbols
          retention-days: 30
